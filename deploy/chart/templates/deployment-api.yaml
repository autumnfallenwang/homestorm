apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homestorm.fullname" (dict "context" . "component" "api") }}
  labels:
    {{- include "homestorm.labels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  # Recreate, not RollingUpdate. Rounds run inside the API process and the browser
  # follows one live stream per meeting from it (ADR 0010): two pods at once would
  # split the streams from the rounds. A deploy stops running answers; they're
  # saved as stopped for the chair to keep or retry.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "homestorm.selectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homestorm.selectorLabels" (dict "context" . "component" "api") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          env:
            # Plaintext config (port, CORS, log level, llmgw URL) from values.yaml.
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # DATABASE_URL — wired via secretKeyRef to homestorm-secrets, created
            # out-of-band (scripts/create-cluster-secret.sh).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
            # Signs the login sessions (ADR 0011). The API refuses to start
            # without it; changing it signs everyone out.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: BETTER_AUTH_SECRET
            # This API's own public URL — Better Auth's baseURL.
            - name: BETTER_AUTH_URL
              value: "http://{{ .Values.api.ingress.host }}"
          livenessProbe:
            {{- toYaml .Values.api.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
