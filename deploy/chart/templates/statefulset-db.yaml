apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "homestorm.fullname" (dict "context" . "component" "db") }}
  labels:
    {{- include "homestorm.labels" (dict "context" . "component" "db") | nindent 4 }}
spec:
  replicas: 1
  # Governs per-pod DNS; points at the headless Service of the same name.
  serviceName: {{ include "homestorm.fullname" (dict "context" . "component" "db") }}
  selector:
    matchLabels:
      {{- include "homestorm.selectorLabels" (dict "context" . "component" "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homestorm.selectorLabels" (dict "context" . "component" "db") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.db.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.db.env.POSTGRES_DB | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.db.env.POSTGRES_USER | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: POSTGRES_PASSWORD
            # PGDATA points at a subdirectory of the mount: postgres' initdb
            # refuses to seed a non-empty directory, and local-path-provisioner
            # may leave a `lost+found` at the mount root depending on the FS.
            - name: PGDATA
              value: {{ printf "%s/pgdata" .Values.db.persistence.mountPath | quote }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.db.env.POSTGRES_USER | quote }}
                - -d
                - {{ .Values.db.env.POSTGRES_DB | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.db.env.POSTGRES_USER | quote }}
                - -d
                - {{ .Values.db.env.POSTGRES_DB | quote }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.db.persistence.mountPath }}
  # apiVersion, kind and volumeMode are what Kubernetes fills in anyway. Without them in the chart, Argo CD's diff
  # sees the live StatefulSet as different and shows the app OutOfSync for good (Loki's chart writes them too).
  # They match the live object, so applying them changes nothing (a claim template can't be changed in place).
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          {{- include "homestorm.labels" (dict "context" . "component" "db") | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        storageClassName: {{ .Values.db.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.db.persistence.size }}
